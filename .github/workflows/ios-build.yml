name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # ��������� manual trigger ��� �� GitHub UI

jobs:
  build-ios:
    runs-on: macos-latest  # ������ Mac runner ��� �� GitHub

    steps:
      # 1. ��������� ��� ������ ���
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. ��������� .NET 9
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 3. ��������� �� MAUI workload
      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      # 4. ������ �� API key ��� �� GitHub Secrets ��� local.properties
      - name: Create local.properties
        run: echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > FitnessApp/FitnessApp/local.properties

      # 5. ����� build ��� iOS (����� code signing � ��� sideload)
      - name: Build iOS
        run: |
          dotnet build FitnessApp/FitnessApp.csproj \
            -f net9.0-ios \
            -c Release \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:CodesignKey="" \
            /p:CodesignProvision="" \
            /p:EnableCodeSigning=false

      # 6. �������� �� IPA �� artifact ��� �� �� ����������
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DailyBite-iOS
          path: |
            FitnessApp/bin/Release/net9.0-ios/**/*.ipa
            FitnessApp/bin/Release/net9.0-ios/**/*.app
          retention-days: 7  # ������� �� ������ 7 �����